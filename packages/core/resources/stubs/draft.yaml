# yaml-language-server: $schema=./draft.schema.json
#
# A draft of templates and fields. Build it with: php artisan lynx:draft
# Preview first with: php artisan lynx:draft --dry-run
#
# A field is "type[:argument]" followed by flags and key:value settings:
#   textarea:html    decimal:2 min:0    choice:Small,Medium,"Extra large" multiple
# Text, textarea and URL fields get a value per language; add translatable:false for one value in every language.
# In a template, "name*" makes a field required there, and {name: type} defines it in place.
# Pages are created unpublished, by URL path; required fields other than the title need a value.

fields:
  intro: textarea
  starts_on: date
  venue: text:120
  ticket_price: decimal:2 min:0
  topics: choice:Design,Development,"Product management" multiple

templates:
  events:
    children: [event]
    fields: [title*, intro]
  event:
    parents: [events]
    fields:
      - title*
      - intro
      - starts_on*
      - section: Practical details
        fields: [venue, ticket_price, topics]

pages:
  /events: Events
