# Builds the documentation site from docs/ with VitePress; the build fails on dead links.
# Pull requests from this repository also upload a preview, at
# pr-<number>-lynx-docs.<subdomain>.workers.dev/cms/docs/. Pushes to main deploy the site to
# lynxcms.org/cms/docs: a Cloudflare Worker with static assets (docs/wrangler.jsonc).
# Needs the CLOUDFLARE_API_TOKEN secret (Workers Scripts: Edit on the account, Workers Routes:
# Edit on the lynxcms.org zone) and the CLOUDFLARE_ACCOUNT_ID secret.
name: docs

on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', '.github/workflows/docs.yml']
  workflow_dispatch:

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
        with:
          # "Last updated" dates come from git history.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm run build

      # Previews need the Worker to exist. Until main first deploys it, create it from
      # wrangler.jsonc without its route, so nothing is served on lynxcms.org before a merge.
      - name: Create the Worker without its route
        if: github.event_name == 'pull_request' && env.CLOUDFLARE_API_TOKEN != ''
        run: |
          if npx wrangler deployments list > /dev/null 2>&1; then exit 0; fi
          node -e "
            const fs = require('fs');
            const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8').replace(/^\s*\/\/.*$/gm, ''));
            delete config.routes;
            delete config['\$schema'];
            fs.writeFileSync('wrangler.unrouted.json', JSON.stringify(config));
          "
          npx wrangler deploy -c wrangler.unrouted.json --message "Created for previews, without its route"

      # Pull requests from forks get no secrets, so they only build.
      - name: Upload a preview
        if: github.event_name == 'pull_request' && env.CLOUDFLARE_API_TOKEN != ''
        run: |
          set -o pipefail
          output=$(npx wrangler versions upload --preview-alias "pr-${PR_NUMBER}" --message "PR #${PR_NUMBER}" 2>&1 | tee /dev/stderr)
          url=$(printf '%s' "$output" | grep -o "https://pr-${PR_NUMBER}-[^ ]*workers\.dev" | head -1)
          echo "Docs preview: ${url}/cms/docs/" >> "$GITHUB_STEP_SUMMARY"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Deploy to lynxcms.org/cms/docs
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npx wrangler deploy --message "${GITHUB_SHA::7}"
