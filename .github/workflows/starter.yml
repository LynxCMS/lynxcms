# Builds the Atlas Training starter (LynxCMS/starter-training) from the training site guide's code
# in docs/snippets/training, with .github/scripts/build-starter.sh: a fresh Laravel app, Lynx from
# Packagist, BlatUI, the guide's files, and the starter's own tests.
# Pull requests that change the guide's code build and test it against the latest release. Tags
# also push it, as one commit on main plus the tag, so the starter always matches a release.
# Needs SPLIT_TOKEN with Contents read and write on LynxCMS/starter-training too.
name: Starter

on:
  pull_request:
    paths: ['docs/snippets/training/**', '.github/scripts/build-starter.sh', '.github/workflows/starter.yml']
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and test, but push nothing
        type: boolean
        default: true

concurrency:
  group: starter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  starter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: sqlite3, pdo_sqlite, intl, gd
          tools: composer:v2

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # A tag builds against itself; other runs against the latest release on Packagist.
      - name: Choose the Lynx version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then tag="${GITHUB_REF_NAME}"; else tag="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"; fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # Packagist can take a minute to list a tag the split workflow has just pushed.
      - name: Wait for the release on Packagist
        if: github.ref_type == 'tag'
        run: |
          for attempt in $(seq 1 30); do
            curl -sf https://repo.packagist.org/p2/lynxcms/core.json | grep -q "\"${{ steps.version.outputs.tag }}\"" && exit 0
            sleep 20
          done
          echo "lynxcms/core ${{ steps.version.outputs.tag }} is not on Packagist yet." >&2
          exit 1

      - name: Build and test the starter
        run: .github/scripts/build-starter.sh "${{ steps.version.outputs.version }}" ../starter-training

      - name: Push to LynxCMS/starter-training
        # A manual run pushes only with dry_run off, and only from a tag.
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false && github.ref_type == 'tag')
        working-directory: ../starter-training
        run: |
          git init --quiet --initial-branch=main
          git add --all
          git -c user.name="github-actions[bot]" -c user.email="41898173+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "Atlas Training starter for Lynx ${TAG}"
          git tag "${TAG}"
          remote="https://x-access-token:${SPLIT_TOKEN}@github.com/LynxCMS/starter-training.git"
          git push --force "${remote}" main
          git push --force "${remote}" "refs/tags/${TAG}"
        env:
          TAG: ${{ steps.version.outputs.tag }}
          SPLIT_TOKEN: ${{ secrets.SPLIT_TOKEN }}
