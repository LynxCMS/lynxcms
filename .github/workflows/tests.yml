name: tests

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels its run in progress.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Whether anything but the documentation's prose changed. A change to docs/ Markdown, its
  # VitePress config, theme or public files only needs the docs integrity tests (below) and the
  # docs workflow; docs/snippets is code the suite runs, so it counts as a change.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! changed=$(git diff --name-only "$BASE" "$GITHUB_SHA" 2>/dev/null) || [ -z "$changed" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=$(echo "$changed" | grep -vE '^docs/(\.vitepress/|public/|package(-lock)?\.json$|wrangler[^/]*$)' | grep -vE '^docs/.+\.md$' || true)
          code=$code$(echo "$changed" | grep -E '^docs/snippets/' || true)
          echo "code=$([ -n "$code" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # Docs-only changes: the tests that read the Markdown (selectors parse, anchors exist, every
  # field type and command is documented), without the full suite.
  docs:
    needs: changes
    if: needs.changes.outputs.code == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, intl, mbstring, zip
          coverage: none
      - uses: actions/cache@v6
        with:
          path: vendor
          key: vendor-${{ runner.os }}-${{ hashFiles('composer.json', 'packages/*/composer.json') }}
          restore-keys: vendor-${{ runner.os }}-
      - run: composer update --prefer-dist --no-interaction --no-progress
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}}'
      - run: vendor/bin/pest tests/Feature/Docs/DocsIntegrityTest.php

  tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The same suites as composer test:all: SQLite, PostgreSQL, and SQLite with a table prefix.
        # PostgreSQL is the slowest, so it runs in three shards at the same time.
        include:
          - { suite: test, shard: '1/1' }
          - { suite: 'test:prefix', shard: '1/1' }
          - { suite: 'test:pgsql', shard: '1/3' }
          - { suite: 'test:pgsql', shard: '2/3' }
          - { suite: 'test:pgsql', shard: '3/3' }
    name: Tests (${{ matrix.suite }} ${{ matrix.shard }})

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lynx_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, pdo_pgsql, intl, mbstring, zip
          coverage: none
      # vendor/ from the last run with the same composer.json files, so composer update only checks.
      - uses: actions/cache@v6
        with:
          path: vendor
          key: vendor-${{ runner.os }}-${{ hashFiles('composer.json', 'packages/*/composer.json') }}
          restore-keys: vendor-${{ runner.os }}-
      # Authenticated downloads from GitHub have a much higher rate limit than anonymous ones.
      - run: composer update --prefer-dist --no-interaction --no-progress
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}}'
      # The admin's stylesheet and script are built, not committed (ADR-0071); tests serve them,
      # so this also checks that they build.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/admin/package-lock.json
      - run: npm ci && npm run build
        working-directory: packages/admin
      # In parallel, one process per core, as locally; PostgreSQL gets a database per process.
      - run: composer ${{ matrix.suite }} -- --ci --shard=${{ matrix.shard }}
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: lynx_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres

  quality:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - uses: actions/cache@v6
        with:
          path: vendor
          key: vendor-${{ runner.os }}-${{ hashFiles('composer.json', 'packages/*/composer.json') }}
          restore-keys: vendor-${{ runner.os }}-
      # PHPStan's and Rector's result caches (build/): only changed files are analysed again.
      - uses: actions/cache@v6
        with:
          path: build
          key: build-${{ runner.os }}-${{ github.sha }}
          restore-keys: build-${{ runner.os }}-
      - run: composer update --prefer-dist --no-interaction --no-progress
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}}'
      - name: Pint
        run: vendor/bin/pint --test
      - name: Rector
        run: vendor/bin/rector process --dry-run --no-progress-bar
      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
