name: tests

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels its run in progress. Runs on main always finish: the next
# push may be docs only and skip the tests, so cancelling would leave code on main untested.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether anything but the documentation's prose changed. A change to docs/ Markdown, its
  # VitePress config, theme or public files only needs the docs integrity tests (below) and the
  # docs workflow; docs/snippets is code the suite runs, so it counts as a change.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      signin: ${{ steps.filter.outputs.signin }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! changed=$(git diff --name-only "$BASE" "$GITHUB_SHA" 2>/dev/null) || [ -z "$changed" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "signin=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The sign-in flows' code, screens, wording and dependencies, and the browser tests
          # themselves: only these run the browser job (ADR-0137).
          signin=$(echo "$changed" | grep -E '^packages/admin/src/(Auth/|Livewire/AccountSecurity\.php|Http/(InvitationController|NewPasswordController|RequireOwnPassword|RequireTwoFactor)\.php)|^packages/admin/resources/views/(auth/|account/|livewire/account-security\.blade\.php|components/(auth-layout|password-rules|notifications)\.blade\.php)|^packages/admin/resources/js/(admin|blatui-core|passkeys|field-errors|notices)\.js|^packages/admin/lang/[a-z]+/(auth|account)\.php|^(packages/admin/)?composer\.json$|^package(-lock)?\.json$|^phpunit\.xml\.dist$|^tests/Browser/|^\.github/workflows/tests\.yml$' || true)
          echo "signin=$([ -n "$signin" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          # Docs and other workflows (starters, split, docs site) need no test run; this one does.
          code=$(echo "$changed" | grep -vE '^docs/(\.vitepress/|public/|package(-lock)?\.json$|wrangler[^/]*$)' | grep -vE '^docs/.+\.md$' | grep -vE '^\.github/' || true)
          code=$code$(echo "$changed" | grep -E '^\.github/workflows/tests\.yml$' || true)
          code=$code$(echo "$changed" | grep -E '^docs/snippets/' || true)
          echo "code=$([ -n "$code" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # Docs-only changes: the tests that read the Markdown (selectors parse, anchors exist, every
  # field type and command is documented), without the full suite.
  docs:
    needs: changes
    if: needs.changes.outputs.code == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, intl, mbstring, zip
          coverage: none
      - uses: actions/cache@v6
        with:
          path: vendor
          key: vendor-${{ runner.os }}-${{ hashFiles('composer.json', 'packages/*/composer.json') }}
          restore-keys: vendor-${{ runner.os }}-
      - run: composer update --prefer-dist --no-interaction --no-progress
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}}'
      - run: vendor/bin/pest tests/Feature/Docs/DocsIntegrityTest.php

  # What a pull request changes in @api code that would break apps: removed or changed classes,
  # methods and signatures (ADR-0132). Classes and methods marked @internal are not checked. Until
  # 1.0 it only reports, in the run's summary; set COMPAT_BLOCKING to true at 1.0 so a break fails.
  compat:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      COMPAT_BLOCKING: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, mbstring, zip
          coverage: none
      - run: composer install --working-dir=tools/compat --prefer-dist --no-interaction --no-progress
      - name: Compare with the pull request's base
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}}'
        run: |
          status=0
          tools/compat/vendor/bin/roave-backward-compatibility-check --from="$BASE" --format=markdown > compat.md || status=$?
          {
            echo "## Backward compatibility of @api code"
            if [ "$status" = 0 ]; then echo "No change breaks apps."; else cat compat.md; fi
          } >> "$GITHUB_STEP_SUMMARY"
          # Exit code 3 means breaks were found; anything else is the check itself failing.
          if [ "$status" = 0 ]; then exit 0; fi
          if [ "$COMPAT_BLOCKING" = true ]; then exit "$status"; fi
          if [ "$status" = 3 ]; then
            echo "::warning title=Backward compatibility::This pull request changes @api code in a way that breaks apps. See the run's summary."
          else
            echo "::warning title=Backward compatibility::The check could not run (exit code $status)."
          fi

  tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pull requests run SQLite only. Pushes to main run the same suites as composer test:all:
        # SQLite, PostgreSQL in three shards at the same time, and SQLite with a table prefix. Few
        # sites use Lynx yet, so a driver problem found minutes after a merge is cheap to fix.
        include: ${{ fromJSON(github.event_name == 'push' && '[{"suite":"test","shard":"1/1"},{"suite":"test:prefix","shard":"1/1"},{"suite":"test:pgsql","shard":"1/3"},{"suite":"test:pgsql","shard":"2/3"},{"suite":"test:pgsql","shard":"3/3"}]' || '[{"suite":"test","shard":"1/1"}]') }}
    name: Tests (${{ matrix.suite }} ${{ matrix.shard }})

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lynx_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, pdo_pgsql, intl, mbstring, zip
          coverage: none
      # vendor/ from the last run with the same composer.json files, so composer update only checks.
      - uses: actions/cache@v6
        with:
          path: vendor
          key: vendor-${{ runner.os }}-${{ hashFiles('composer.json', 'packages/*/composer.json') }}
          restore-keys: vendor-${{ runner.os }}-
      # Authenticated downloads from GitHub have a much higher rate limit than anonymous ones.
      - run: composer update --prefer-dist --no-interaction --no-progress
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}}'
      # The admin's stylesheet and script are built, not committed (ADR-0071); tests serve them,
      # so this also checks that they build.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/admin/package-lock.json
      - run: npm ci && npm run build
        working-directory: packages/admin
      # In parallel, one process per core, as locally; PostgreSQL gets a database per process.
      - run: composer ${{ matrix.suite }} -- --ci --shard=${{ matrix.shard }}
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: lynx_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres

  # The sign-in flows in a real browser (tests/Browser): Pest's browser plugin drives Chromium
  # through Playwright. Its own job, so the main suite needs no browser, and only when the
  # sign-in flows change (the changes job's signin output).
  browser:
    needs: changes
    if: needs.changes.outputs.signin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, intl, mbstring, zip
          coverage: none
      - uses: actions/cache@v6
        with:
          path: vendor
          key: vendor-${{ runner.os }}-${{ hashFiles('composer.json', 'packages/*/composer.json') }}
          restore-keys: vendor-${{ runner.os }}-
      - run: composer update --prefer-dist --no-interaction --no-progress
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}}'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/admin/package-lock.json
      - run: npm ci && npm run build
        working-directory: packages/admin
      - run: npm ci && npx playwright install --with-deps chromium
      - run: composer test:browser -- --ci
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-screenshots
          path: tests/Browser/Screenshots

  quality:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - uses: actions/cache@v6
        with:
          path: vendor
          key: vendor-${{ runner.os }}-${{ hashFiles('composer.json', 'packages/*/composer.json') }}
          restore-keys: vendor-${{ runner.os }}-
      # PHPStan's and Rector's result caches (build/): only changed files are analysed again.
      - uses: actions/cache@v6
        with:
          path: build
          key: build-${{ runner.os }}-${{ github.sha }}
          restore-keys: build-${{ runner.os }}-
      - run: composer update --prefer-dist --no-interaction --no-progress
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}}'
      - name: Pint
        run: vendor/bin/pint --test
      - name: Rector
        run: vendor/bin/rector process --dry-run --no-progress-bar
      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
