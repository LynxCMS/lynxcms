name: tests

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels its run in progress.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The same suites as composer test:all: SQLite, PostgreSQL, and SQLite with a table prefix.
        suite: [test, 'test:pgsql', 'test:prefix']
    name: Tests (${{ matrix.suite }})

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lynx_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, pdo_pgsql, intl, mbstring, zip
          coverage: none
      # vendor/ from the last run with the same composer.json files, so composer update only checks.
      - uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ runner.os }}-${{ hashFiles('composer.json', 'packages/*/composer.json') }}
          restore-keys: vendor-${{ runner.os }}-
      # Authenticated downloads from GitHub have a much higher rate limit than anonymous ones.
      - run: composer update --prefer-dist --no-interaction --no-progress
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}}'
      # In parallel, one process per core, as locally; PostgreSQL gets a database per process.
      - run: composer ${{ matrix.suite }} -- --ci
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: lynx_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ runner.os }}-${{ hashFiles('composer.json', 'packages/*/composer.json') }}
          restore-keys: vendor-${{ runner.os }}-
      # PHPStan's and Rector's result caches (build/): only changed files are analysed again.
      - uses: actions/cache@v4
        with:
          path: build
          key: build-${{ runner.os }}-${{ github.sha }}
          restore-keys: build-${{ runner.os }}-
      - run: composer update --prefer-dist --no-interaction --no-progress
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}}'
      - name: Pint
        run: vendor/bin/pint --test
      - name: Rector
        run: vendor/bin/rector process --dry-run --no-progress-bar
      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  assets:
    runs-on: ubuntu-latest
    name: Admin CSS is up to date
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/admin/package-lock.json
      - run: npm ci
        working-directory: packages/admin
      # Rebuilds dist/admin.css from the views and CSS sources and fails if the committed file differs.
      - run: npm run check
        working-directory: packages/admin
