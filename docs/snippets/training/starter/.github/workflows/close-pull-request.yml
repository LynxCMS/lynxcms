# This starter is generated from LynxCMS/lynxcms (docs/snippets/training): pull requests belong there.
name: Close pull requests

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - run: gh pr close "$PR" --repo "$REPO" --comment "Thank you! This starter is generated from the Lynx CMS monorepo on every release. Please open your pull request at https://github.com/LynxCMS/lynxcms instead."
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
